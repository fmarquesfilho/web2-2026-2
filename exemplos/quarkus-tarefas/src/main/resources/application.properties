# Porta 8081 para rodar lado a lado com o exemplo Ktor (8080).
quarkus.http.port=8081
# Porta dos testes fora da 8081, para testar com o dev mode aberto.
quarkus.http.test-port=8083

# Banco. Em dev e test, sem URL, o Quarkus sobe um PostgreSQL no Docker (Dev Services).
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tarefas}
%prod.quarkus.datasource.username=${DB_USER:tarefas}
%prod.quarkus.datasource.password=${DB_PASSWORD:tarefas}

# O esquema vem só das migrações do Flyway; o Hibernate não cria nem altera tabelas.
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true

quarkus.smallrye-openapi.info-title=Tarefas
